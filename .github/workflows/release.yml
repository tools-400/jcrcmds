name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'docs/files/rdi8.0/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.r'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, was getaggt und veroeffentlicht wuerde'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine the release
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Push eines Tags: der Tag bestimmt das Release.
          if [ "${REF_TYPE}" = "tag" ]; then
            echo "Tag ${REF_NAME} wurde gepusht."
            echo "tag=${REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Push auf main oder manueller Start: das Update-Site-ZIP bestimmt
          # die Version.
          shopt -s nullglob
          ZIPS=( docs/files/rdi8.0/*"Update Site).zip" )
          if [ ${#ZIPS[@]} -ne 1 ]; then
            echo "Update-Site-ZIP nicht eindeutig (${#ZIPS[@]} Treffer):" >&2
            printf '  %s\n' "${ZIPS[@]}" >&2
            exit 1
          fi
          ZIP="${ZIPS[0]}"

          RE='\(v([0-9]+\.[0-9]+\.[0-9]+\.r) Update Site\)\.zip$'
          if [[ ! "${ZIP}" =~ ${RE} ]]; then
            echo "Keine Release-Version: ${ZIP}"
            exit 0
          fi
          TAG="v${BASH_REMATCH[1]}"

          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} existiert bereits."
            exit 0
          fi

          # Der Commit, der das ZIP zuletzt geaendert hat, ist der
          # Release-Commit.
          COMMIT=$(git log -1 --format=%H -- "${ZIP}")
          echo "Tag ${TAG} -> $(git log -1 --format='%h %s' "${COMMIT}")"

          {
            echo "tag=${TAG}"
            echo "commit=${COMMIT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create the tag
        if: steps.release.outputs.commit != '' && !inputs.dry_run
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Tag ${TAG}." "${COMMIT}"
          git push origin "refs/tags/${TAG}"

      - name: Check out the release
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          REF: ${{ steps.release.outputs.commit || steps.release.outputs.tag }}
        run: git checkout --quiet --detach "${REF}"

      - name: Resolve version and assets
        id: assets
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          echo "Version: ${VERSION}"

          shopt -s nullglob
          ZIPS=( "docs/files/rdi8.0/JCRCMDS for RDi"*"(v${VERSION} Update Site).zip" )
          if [ ${#ZIPS[@]} -ne 1 ]; then
            echo "Update-Site-ZIP fuer v${VERSION} nicht eindeutig (${#ZIPS[@]} Treffer):" >&2
            printf '  %s\n' "${ZIPS[@]}" >&2
            exit 1
          fi
          ZIP="${ZIPS[0]}"
          echo "ZIP: ${ZIP}"

          {
            echo "version=${VERSION}"
            echo "zip_path=${ZIP}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: steps.release.outputs.tag != '' && !inputs.dry_run
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: JCRCMDS v${{ steps.assets.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.assets.outputs.zip_path }}
